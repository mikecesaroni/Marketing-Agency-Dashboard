# Copies the twelve real equipment photos (and the ChatGPT sample ads, from
# ai-ads/samples/, and the ChatGPT template art, from stock/template-art/)
# from the public stock library into
# a throwaway branch (relay/stock-units), so a build or a review session that
# cannot reach the Supabase bucket directly can still fetch them from GitHub.
# Run it by hand (Actions > Relay the stock unit photos > Run workflow), or
# push any commit to the relay/run branch, which exists for nothing else.
name: Relay the stock unit photos

on:
  workflow_dispatch:
  push:
    branches:
      - relay/run

jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the photos from the public bucket
        run: |
          mkdir -p relay/units
          for k in ac furnace boiler water_heater mini_split thermostat old_ac old_furnace old_boiler old_water_heater old_mini_split old_thermostat; do
            if curl -fsSL -o "relay/units/$k.png" "https://zjtwqpaaejrkurtuakdz.supabase.co/storage/v1/object/public/client-files/stock/units/$k.png"; then
              echo "got $k ($(stat -c%s "relay/units/$k.png") bytes)"
            else
              echo "missing $k"
              rm -f "relay/units/$k.png"
            fi
          done
          ls -la relay/units
      - name: Fetch the ChatGPT sample ads too
        run: |
          mkdir -p relay/ai-samples
          for k in sun-deal clunkers split-pop cloud-price payment-stack rebate-burst feature-list winter-shout massive-deal price-grid fall-special season-sale holiday-deals tune-up poster emergency financing coupon big-number plan-card; do
            for s in tall square; do
              curl -fsSL -o "relay/ai-samples/$k-$s.jpg" "https://zjtwqpaaejrkurtuakdz.supabase.co/storage/v1/object/public/client-files/ai-ads/samples/$k-$s.jpg" || rm -f "relay/ai-samples/$k-$s.jpg"
            done
          done
          ls -la relay/ai-samples
      - name: Fetch the ChatGPT template art too
        run: |
          mkdir -p relay/template-art
          for k in burst burst_red pop coral deep snow leaves sun fresh glow night holiday paper brand sun_deal clunkers rebate_burst; do
            for s in square tall; do
              curl -fsSL -o "relay/template-art/$k-$s.jpg" "https://zjtwqpaaejrkurtuakdz.supabase.co/storage/v1/object/public/client-files/stock/template-art/$k-$s.jpg" || rm -f "relay/template-art/$k-$s.jpg"
            done
          done
          ls -la relay/template-art
      - name: Put them on the relay branch
        run: |
          git config user.name "stock-relay"
          git config user.email "stock-relay@users.noreply.github.com"
          git checkout --orphan relay/stock-units
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f relay/units relay/ai-samples relay/template-art
          git commit -m "Relay: the stock unit photos as of $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin relay/stock-units
