<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the page reach under the notch and home
         indicator, which is what makes env(safe-area-inset-*) report real
         values instead of 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Roundtable Marketing Agency CRM</title>

    <!-- Inter is what the ad compositor draws with. system-ui renders as a
         different face on every device, which would mean the artboard you
         approve and the PNG someone else exports wrap on different words. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />

    <!-- iOS ignores the manifest's display mode on older versions, so these
         are what actually strip the Safari chrome on an added-to-home-screen
         launch. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Roundtable" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Where to learn your way around. rel="help" is the standard hint, and
         /llms.txt is the same guide as a real file for anything that cannot run
         the app. Both come from src/lib/agentGuide.js. -->
    <link rel="help" href="/guide" title="Navigating this CRM" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="Navigating this CRM" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Without JavaScript this page is an empty div, which is a dead end
         rather than an answer. A reader that got this far and saw nothing is
         told where the plain-text guide is instead. -->
    <noscript>
      <p style="font: 16px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 34rem">
        This CRM needs JavaScript to run. A plain-text guide to what it holds and
        how it is laid out is at <a href="/llms.txt">/llms.txt</a>, and the
        privacy policy is at <a href="/privacy">/privacy</a>.
      </p>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
