[build]
  command = "npm run build"
  publish = "dist"

# The privacy policy is a real static file rather than an app route, because
# Meta's app review fetches it with a crawler that does not reliably run
# JavaScript and the SPA catch-all below would hand it an empty shell. Order
# matters: first match wins.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# THE CLIENT-FACING SITE, enforced at the edge.
#
# Clients get token links (dashboard, weekly report, ad approval, onboarding
# form, video scripts, their videos). Serve those from their own address and nothing else exists there:
# a client who edits the link gets the dead-end page, not the CRM. The app
# does the same in src/lib/publicSite.js; these rules make Netlify refuse
# first, before any JavaScript runs.
#
# To switch on: add the client domain to this site in Netlify (Domain
# management), put its host in the rules below in place of
# clients.example.com, set VITE_PUBLIC_HOST in the site's environment to
# the same host, and redeploy. Domain-level rules must sit above the
# catch-all below; first match wins. The address the links go out on is
# saved in the CRM itself (Reports, Client dashboards, "Links go out on":
# app_settings.public_app_url, read by the app and by the weekly-report
# function), so no VITE_PUBLIC_APP_URL or APP_URL secret is needed for
# that; both still work as fallbacks.
#
# [[redirects]]
#   from = "https://clients.example.com/dashboard/*"
#   to = "/index.html"
#   status = 200
# [[redirects]]
#   from = "https://clients.example.com/report/*"
#   to = "/index.html"
#   status = 200
# [[redirects]]
#   from = "https://clients.example.com/approve/*"
#   to = "/index.html"
#   status = 200
# [[redirects]]
#   from = "https://clients.example.com/onboarding/*"
#   to = "/index.html"
#   status = 200
# [[redirects]]
#   from = "https://clients.example.com/scripts/*"
#   to = "/index.html"
#   status = 200
# [[redirects]]
#   from = "https://clients.example.com/videos/*"
#   to = "/index.html"
#   status = 200
# [[redirects]]
#   from = "https://clients.example.com/pay/*"
#   to = "/index.html"
#   status = 200
# [[redirects]]
#   from = "https://clients.example.com/*"
#   to = "/nothing-here.html"
#   status = 404

# THE CLIENT PAGES GET THEIR OWN SHELL. client.html is the same app without
# the CRM's web app manifest: a home screen icon opens a manifest's start
# page, and the CRM's is the login, so a client who saved their dashboard to
# their phone got the sign-in form ("as soon as I added it as a bookmark it
# wants me to log in"). Served at the edge, before any script runs, so no
# phone ever sees the manifest on a client page. Before the catch-all.
[[redirects]]
  from = "/dashboard/*"
  to = "/client.html"
  status = 200

[[redirects]]
  from = "/report/*"
  to = "/client.html"
  status = 200

[[redirects]]
  from = "/approve/*"
  to = "/client.html"
  status = 200

[[redirects]]
  from = "/onboarding/*"
  to = "/client.html"
  status = 200

[[redirects]]
  from = "/scripts/*"
  to = "/client.html"
  status = 200

[[redirects]]
  from = "/videos/*"
  to = "/client.html"
  status = 200

[[redirects]]
  from = "/pay/*"
  to = "/client.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
